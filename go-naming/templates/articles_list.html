<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บทความทั้งหมด - แอปชื่อดี</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #E2B237;
            --secondary: #9B51E0;
            --accent: #FF2E93;
            --bg: linear-gradient(135deg, #FAF8FF 0%, #FFF5FA 50%, #FFFDF5 100%);
            --card: rgba(255, 255, 255, 0.85);
            --border-color: rgba(155, 81, 224, 0.12);
            --border-color-hover: rgba(155, 81, 224, 0.32);
            --text-light: #2D1E4E;
            --text-gray: #6C5B7B;
            --violet: linear-gradient(135deg, #9B51E0 0%, #FF2E93 100%);
        }

        body {
            background: var(--bg) no-repeat fixed;
            color: var(--text-light);
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .articles-nav {
            height: 80px;
            background: rgba(250, 248, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1050;
        }

        .nav-home-btn {
            text-decoration: none;
            color: var(--text-gray);
            font-family: 'Prompt';
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid transparent;
        }

        .nav-home-btn:hover {
            color: var(--secondary);
            background: rgba(155, 81, 224, 0.05);
            border-color: rgba(155, 81, 224, 0.1);
        }

        .page-header {
            text-align: center;
            padding: 80px 0 40px 0;
        }

        .page-header h1 {
            font-family: 'Prompt', sans-serif;
            font-size: 40px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #2D1E4E, #9B51E0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: var(--text-gray);
            margin-top: 15px;
            font-size: 18px;
            font-weight: 300;
        }

        .articles-grid {
            max-width: 1200px;
            margin: 40px auto 60px auto;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 0;
            overflow: hidden;
        }

        .article-card {
            position: relative;
            background: #0f0b24;
            border-radius: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            height: 320px;
            border: none;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(15, 11, 36, 0.25);
            z-index: 2;
        }

        .card-image-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .article-card:hover .card-image {
            transform: scale(1.05);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(15, 11, 36, 0.95) 80%);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 140px;
        }

        .card-category {
            display: inline-block;
            background: var(--violet);
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            align-self: flex-start;
            letter-spacing: 0.5px;
        }

        .card-title {
            font-family: 'Prompt', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .card-footer {
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .card-footer .read-more {
            color: #FF2E93;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .article-card:hover .read-more {
            color: #ff57a9;
            gap: 8px;
        }

        .pagination {
            max-width: 1200px;
            margin: 40px auto 80px auto;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .pagination-btn {
            padding: 10px 20px;
            border-radius: 8px;
            background: var(--card);
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-light);
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(155, 81, 224, 0.05);
        }

        .pagination-btn:hover {
            border-color: var(--border-color-hover);
            color: var(--secondary);
            background: #FFFFFF;
        }

        .pagination-btn.active {
            background: var(--violet);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(155, 81, 224, 0.3);
        }

        @media (max-width: 768px) {
            .articles-grid {
                grid-template-columns: 1fr;
                margin: 20px 16px;
            }

            .page-header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <nav class="articles-nav">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 100%;">
            <a href="/" style="text-decoration: none; display: flex; align-items: center;">
                <span class="logo-text">แอปชื่อดี</span>
            </a>
            <div style="display: flex; align-items: center; gap: 10px;">
                <a href="/about" class="nav-home-btn">
                    <i data-lucide="info" style="width: 18px; height: 18px;"></i> เกี่ยวกับเรา
                </a>
                <a href="/" class="nav-home-btn">
                    <i data-lucide="home" style="width: 18px; height: 18px;"></i> หน้าแรก
                </a>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>คลังความรู้เรื่องชื่อมงคล</h1>
            <p>รวมบทความ เทคนิค และศาสตร์การตั้งชื่อที่คุณควรรู้</p>
        </div>
    </header>

    <main class="articles-grid">
        {{range .Articles}}
        <a href="/article/{{.Slug}}" class="article-card">
            <div class="card-image-wrapper">
                <img src="{{if .ImageURL}}{{.ImageURL}}{{else if .YouTubeThumbnailURL}}{{.YouTubeThumbnailURL}}{{else}}/main_highlight.png{{end}}" alt="{{.Title}}"
                    class="card-image">
                <div class="card-overlay">
                    <span class="card-category">{{.Category}}</span>
                    <h2 class="card-title">{{.Title}}</h2>
                    <div class="card-footer">
                        <span style="display: flex; align-items: center; gap: 4px;">
                            <i data-lucide="calendar" style="width: 14px; height: 14px;"></i> 
                            {{.PublishedAt.Format "02 Jan 2006"}}
                        </span>
                        <span class="read-more">อ่านต่อ <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i></span>
                    </div>
                </div>
            </div>
        </a>
        {{else}}
        <div style="grid-column: 1/-1; text-align: center; padding: 100px 0;">
            <p style="color: var(--text-gray); font-size: 18px;">ยังไม่มีบทความในขณะนี้</p>
        </div>
        {{end}}
    </main>

    <div class="pagination">
        {{if gt .Page 1}}
        <a href="/articles?page={{add .Page -1}}" class="pagination-btn">ก่อนหน้า</a>
        {{end}}
        <a href="/articles?page={{.Page}}" class="pagination-btn active">{{.Page}}</a>
        <a href="/articles?page={{add .Page 1}}" class="pagination-btn">ถัดไป</a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
