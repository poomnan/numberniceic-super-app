<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ชื่อดี - ที่ปรึกษาตั้งชื่อมงคล</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #B8860B;
            --primary-light: #D4AF37;
            --primary-glow: rgba(212, 175, 55, 0.3);
            --accent: #FFD700;
            --accent-glow: rgba(255, 215, 0, 0.25);
            --green: #10b981;
            --red: #ef4444;
            --bg: #FFF8E1;
            --bg-chat: #FFFAF0;
            --surface: rgba(212, 175, 55, 0.04);
            --surface-hover: rgba(212, 175, 55, 0.08);
            --border: rgba(212, 175, 55, 0.2);
            --text: #2C1810;
            --text-dim: #5D4037;
            --bot-bubble: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(184, 134, 11, 0.08));
            --user-bubble: linear-gradient(135deg, #B8860B, #D4AF37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: rgba(12, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 10;
        }

        .chat-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .chat-header .info h1 {
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(90deg, #e2d1ff, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-header .info p {
            font-size: 11px;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-header .info p::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .header-actions button:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        /* Chat Area */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar {
            width: 4px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
        }

        /* Welcome */
        .welcome-section {
            text-align: center;
            padding: 20px 10px;
            animation: fadeIn 0.6s ease;
        }

        .welcome-section .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 16px;
            box-shadow: 0 0 40px var(--primary-glow), 0 0 80px rgba(245, 158, 11, 0.1);
        }

        .welcome-section h2 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(90deg, #c4b5fd, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .welcome-section p {
            font-size: 13px;
            color: var(--text-dim);
            max-width: 320px;
            margin: 0 auto 20px;
            line-height: 1.7;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 400px;
            margin: 0 auto;
        }

        .quick-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 20px;
            font-family: 'Sarabun', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .quick-btn:hover {
            background: var(--primary-glow);
            border-color: var(--primary-light);
            transform: translateY(-1px);
        }

        .quick-btn .icon {
            margin-right: 4px;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: slideUp 0.3s ease;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            align-self: flex-end;
        }

        .message.bot .msg-avatar {
            background: linear-gradient(135deg, var(--primary), #a855f7);
        }

        .message.user .msg-avatar {
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
        }

        .msg-content {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.7;
            position: relative;
        }

        .message.bot .msg-content {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message.user .msg-content {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            color: white;
        }

        .msg-content p {
            margin-bottom: 6px;
        }

        .msg-content p:last-child {
            margin-bottom: 0;
        }

        .msg-content strong {
            color: var(--accent);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            gap: 8px;
            align-items: center;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-indicator .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .typing-dots {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 5px;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--primary-light);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }

        /* Name Cards */
        .name-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
        }

        .name-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s;
        }

        .name-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary-light);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .name-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .name-card-header .th-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
        }

        .grade-badges {
            display: flex;
            gap: 6px;
        }

        .grade-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }

        .grade-badge.good {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .grade-badge.bad {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .name-card .meaning {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .name-card .numerology {
            display: flex;
            gap: 12px;
            font-size: 12px;
        }

        .num-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .num-item .label {
            color: var(--text-dim);
        }

        .num-item .value {
            font-weight: 600;
        }

        .num-item .value.good {
            color: #34d399;
        }

        .num-item .value.bad {
            color: #f87171;
        }

        /* Input Area */
        .chat-input-area {
            flex-shrink: 0;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: rgba(12, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 6px 6px 6px 18px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Sarabun', sans-serif;
            font-size: 14px;
            resize: none;
            outline: none;
            max-height: 100px;
            line-height: 1.5;
            padding: 6px 0;
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-dim);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--user-bubble);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            font-size: 16px;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (min-width: 640px) {
            body {
                background: var(--bg);
            }

            .chat-container {
                max-width: 520px;
                margin: 0 auto;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
            }
        }

        /* Context Bar */
        .context-bar {
            display: flex;
            gap: 6px;
            padding: 6px 16px;
            background: rgba(139, 92, 246, 0.06);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .ctx-badge {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: #c4b5fd;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            white-space: nowrap;
        }

        /* Disclaimer */
        .disclaimer {
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            padding: 4px 16px 0;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar">🔮</div>
            <div class="info">
                <h1>คุณทญา — ตั้งชื่อตามอารมณ์และความรู้สึก</h1>
                <p>ตามหลักเลขศาสตร์</p>
            </div>
            <div class="header-actions">
                <button onclick="clearChat()" title="เริ่มใหม่"><i class="fas fa-rotate-right"></i></button>
            </div>
        </div>
        <!-- Context Badges -->
        <div class="context-bar" id="contextBadges" style="display:none;"></div>

        <!-- Chat Body -->
        <div class="chat-body" id="chatBody">
            <!-- Welcome -->
            <div class="welcome-section" id="welcomeSection">
                <div class="logo">🔮</div>
                <h2>ชื่อดี ตั้งชื่อมงคล</h2>
                <p>สวัสดีค่ะ คุณทญาพร้อมช่วยตั้งชื่อมงคลตามหลักเลขศาสตร์ให้คุณค่ะ บอกวันเกิดและแนวชื่อที่ต้องการได้เลย
                </p>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="sendQuick('หาชื่อลูกชาย ความหมายดี ร่ำรวย เจริญรุ่งเรือง')">
                        <span class="icon">�</span> ชื่อลูกชาย ร่ำรวย
                    </button>
                    <button class="quick-btn" onclick="sendQuick('หาชื่อลูกสาว ความหมายเป็นที่รัก มีเสน่ห์')">
                        <span class="icon">🌸</span> ชื่อลูกสาว มีเสน่ห์
                    </button>
                    <button class="quick-btn" onclick="sendQuick('อยากเปลี่ยนชื่อใหม่ แนวผู้นำ การงานเจริญรุ่ง')">
                        <span class="icon">✨</span> เปลี่ยนชื่อ แนวผู้นำ
                    </button>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="msg-avatar">🔮</div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="chat-input-area">
            <div class="disclaimer">ผลลัพธ์อ้างอิงหลักเลขศาสตร์ชั้นสูง ฐานข้อมูล 300,000+ ชื่อ</div>
            <div class="input-wrapper" style="margin-top:6px;">
                <textarea id="msgInput" rows="1"
                    placeholder="พิมพ์ข้อความ เช่น &quot;ตั้งชื่อลูกชาย เกิดวันจันทร์&quot;"
                    onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById('chatBody');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeSection = document.getElementById('welcomeSection');

        let chatHistory = [];
        let chatContext = { day: '', gender: '', keywords: '' };
        let isSending = false;

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendQuick(text) {
            msgInput.value = text;
            sendMessage();
        }

        function clearChat() {
            chatHistory = [];
            chatContext = { day: '', gender: '', keywords: '' };
            updateContextBadges();
            chatBody.innerHTML = '';
            // Re-add welcome
            chatBody.innerHTML = `
        <div class="welcome-section" id="welcomeSection">
            <div class="logo">🔮</div>
            <h2>ชื่อดี ตั้งชื่อมงคล</h2>
            <p>สวัสดีค่ะ คุณทญาพร้อมช่วยตั้งชื่อมงคลตามหลักเลขศาสตร์ให้คุณค่ะ บอกวันเกิดและแนวชื่อที่ต้องการได้เลย</p>
            <div class="quick-actions">
                <button class="quick-btn" onclick="sendQuick('หาชื่อลูกชาย ความหมายดี ร่ำรวย เจริญรุ่งเรือง')">
                    <span class="icon">�</span> ชื่อลูกชาย ร่ำรวย
                </button>
                <button class="quick-btn" onclick="sendQuick('หาชื่อลูกสาว ความหมายเป็นที่รัก มีเสน่ห์')">
                    <span class="icon">🌸</span> ชื่อลูกสาว มีเสน่ห์
                </button>
                <button class="quick-btn" onclick="sendQuick('อยากเปลี่ยนชื่อใหม่ แนวผู้นำ การงานเจริญรุ่ง')">
                    <span class="icon">✨</span> เปลี่ยนชื่อ แนวผู้นำ
                </button>
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <div class="msg-avatar">🔮</div>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>`;
        }

        function addMessage(role, text, nameData) {
            // Remove welcome on first message
            const w = document.getElementById('welcomeSection');
            if (w) w.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (role === 'user' ? 'user' : 'bot');

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = role === 'user' ? '👤' : '🔮';

            const content = document.createElement('div');
            content.className = 'msg-content';

            // Format text with markdown-like bold
            let html = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            content.innerHTML = html;

            // Name cards
            if (nameData && nameData.length > 0) {
                const cardsDiv = document.createElement('div');
                cardsDiv.className = 'name-cards';

                nameData.forEach(n => {
                    const gradeTh = {
                        'D10': 'ดีเยี่ยม', 'D8': 'ดีมาก', 'D5': 'ดี',
                        'R10': 'ร้ายมาก', 'R7': 'ร้าย', 'R5': 'ค่อนข้างร้าย'
                    };
                    const satGood = n.sat_grade && n.sat_grade.startsWith('D');
                    const shaGood = n.sha_grade && n.sha_grade.startsWith('D');

                    const card = document.createElement('div');
                    card.className = 'name-card';
                    card.innerHTML = `
                <div class="name-card-header">
                    <span class="th-name">${n.thname}</span>
                    <div class="grade-badges">
                        <span class="grade-badge ${satGood ? 'good' : 'bad'}">ศาสตร์ ${gradeTh[n.sat_grade] || n.sat_grade}</span>
                        <span class="grade-badge ${shaGood ? 'good' : 'bad'}">เงา ${gradeTh[n.sha_grade] || n.sha_grade}</span>
                    </div>
                </div>
                <div class="meaning">${n.meaning || ''}</div>
                <div class="numerology">
                    <div class="num-item">
                        <span class="label">✨ เลขศาสตร์:</span>
                        <span class="value ${satGood ? 'good' : 'bad'}">${n.sat_sum} (${n.sat_pairs ? n.sat_pairs.join(',') : ''})</span>
                    </div>
                    <div class="num-item">
                        <span class="label">🌑 พลังเงา:</span>
                        <span class="value ${shaGood ? 'good' : 'bad'}">${n.sha_sum} (${n.sha_pairs ? n.sha_pairs.join(',') : ''})</span>
                    </div>
                </div>`;
                    cardsDiv.appendChild(card);
                });
                content.appendChild(cardsDiv);
            }

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);

            // Insert before typing indicator
            const ti = document.getElementById('typingIndicator');
            chatBody.insertBefore(msgDiv, ti);
            scrollToBottom();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatBody.scrollTop = chatBody.scrollHeight;
            });
        }

        function showTyping(show) {
            const ti = document.getElementById('typingIndicator');
            if (ti) ti.classList.toggle('active', show);
            if (show) scrollToBottom();
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || isSending) return;

            isSending = true;
            sendBtn.disabled = true;
            msgInput.value = '';
            msgInput.style.height = 'auto';

            // Add user message
            addMessage('user', text);
            chatHistory.push({ role: 'user', content: text });

            showTyping(true);

            try {
                const res = await fetch('/api/v1/naming/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory.slice(-10),
                        guest_id: getGuestId(),
                        member_id: '',
                        context: chatContext
                    })
                });

                const data = await res.json();
                showTyping(false);

                // Save context from backend
                if (data.context) {
                    chatContext = data.context;
                    updateContextBadges();
                }

                const reply = data.reply || 'ขออภัยค่ะ ระบบขัดข้อง กรุณาลองใหม่อีกครั้ง';
                addMessage('bot', reply, data.data);
                chatHistory.push({ role: 'assistant', content: reply });

            } catch (err) {
                showTyping(false);
                addMessage('bot', 'ขออภัยค่ะ เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง 🙏');
            }

            isSending = false;
            sendBtn.disabled = false;
            msgInput.focus();
        }

        function getGuestId() {
            let id = localStorage.getItem('chudee_guest_id');
            if (!id) {
                id = 'web_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('chudee_guest_id', id);
            }
            return id;
        }

        function updateContextBadges() {
            const el = document.getElementById('contextBadges');
            if (!el) return;
            let badges = [];
            const dayMap = { 'จันทร์': 'จันทร์', 'อังคาร': 'อังคาร', 'พุธกลางวัน': 'พุธ(กลางวัน)', 'พุธกลางคืน': 'พุธ(กลางคืน)', 'พฤหัสบดี': 'พฤหัส', 'ศุกร์': 'ศุกร์', 'เสาร์': 'เสาร์', 'อาทิตย์': 'อาทิตย์' };
            const genderMap = { 'ช': '👦 ชาย', 'ญ': '👧 หญิง', 'ค': '🧑 คละ' };
            if (chatContext.day) badges.push('📅 ' + (dayMap[chatContext.day] || chatContext.day));
            if (chatContext.gender) badges.push(genderMap[chatContext.gender] || chatContext.gender);
            if (chatContext.keywords) badges.push('🔍 ' + chatContext.keywords);
            el.innerHTML = badges.map(b => `<span class="ctx-badge">${b}</span>`).join('');
            el.style.display = badges.length ? 'flex' : 'none';
        }

        // Focus input on load (desktop only)
        if (window.innerWidth > 640) msgInput.focus();
    </script>
</body>

</html>
