<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Article.Title}} - Go Naming</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-pink: #D4AF37;
            --dark-bg: #FFF8E1;
            --dark-surface: #FFFAF0;
            --dark-surface-2: #FFF3C4;
            --text-main: #2C1810;
            --text-title: #1A0D07;
            --text-muted: #5D4037;
            --accent-glow: rgba(212, 175, 55, 0.2);
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Sarabun', sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease;
        }

        .article-nav {
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .article-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .article-header {
            margin-bottom: 50px;
            text-align: center;
        }

        .article-category {
            background: var(--primary-pink);
            color: white;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 700;
            font-family: 'Prompt', sans-serif;
            margin-bottom: 20px;
            display: inline-block;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .article-title {
            font-family: 'Prompt', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: var(--text-title);
            line-height: 1.25;
            margin: 10px 0 25px 0;
            letter-spacing: -0.5px;
        }

        .article-meta {
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-bottom: 1px solid #333;
            padding-bottom: 25px;
        }

        .article-hero-image {
            width: 100%;
            height: auto;
            min-height: 400px;
            max-height: 600px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        .article-content {
            font-size: 19px;
            color: var(--text-main);
            margin-bottom: 80px;
            font-weight: 300;
        }

        .article-content p {
            margin-bottom: 30px;
        }

        .article-content h2,
        .article-content h3 {
            font-family: 'Prompt', sans-serif;
            color: var(--text-title);
            margin-top: 50px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .article-content strong {
            color: var(--text-title);
            font-weight: 600;
        }

        .article-content a {
            color: var(--primary-pink);
            text-decoration: none;
            border-bottom: 1px dashed var(--primary-pink);
            transition: all 0.2s;
        }

        .article-content a:hover {
            background: var(--accent-glow);
            border-bottom-style: solid;
        }

        /* Related Section in Dark Mode */
        .related-section {
            background: var(--dark-surface);
            padding: 80px 0;
            margin-top: 100px;
            border-top: 1px solid #333;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .related-card {
            background: var(--dark-surface-2);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid #444;
        }

        .related-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-pink);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 15px var(--accent-glow);
        }

        .card-image-wrapper {
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: #222;
        }

        .related-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .related-card:hover img {
            transform: scale(1.05);
        }

        .related-card-content {
            padding: 18px;
            flex-grow: 1;
        }

        .related-card-title {
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
            color: var(--text-title);
        }

        @media (max-width: 900px) {
            .related-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .article-title {
                font-size: 32px;
            }
        }

        @media (max-width: 500px) {
            .related-grid {
                grid-template-columns: 1fr;
            }

            .article-hero-image {
                min-height: 250px;
            }
        }

        /* Fix Duplicate Image: Hide first image in content if hero image exists */
        .article-hero-image+.article-content>div:first-child img,
        .article-hero-image+.article-content>p:first-child img,
        .article-hero-image+.article-content>img:first-child {
            display: none !important;
        }
    </style>
</head>

<body>

    <nav class="article-nav">
        <div class="container"
            style="display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 0 20px;">
            <a href="/" style="text-decoration: none; display: flex; align-items: center;">
                <span
                    style="font-family: 'Prompt'; font-weight: 800; font-size: 20px; background: linear-gradient(135deg, #B8860B, #D4AF37); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">แอปชื่อดี</span>
            </a>
            <a href="/"
                style="text-decoration: none; color: #666; font-family: 'Prompt'; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 5px;">
                <i data-lucide="home" style="width: 16px;"></i> หน้าแรก
            </a>
        </div>
    </nav>

    <article class="article-container">
        <header class="article-header">
            <span class="article-category">{{.Article.Category}}</span>
            <h1 class="article-title">{{.Article.Title}}</h1>
            <div class="article-meta">
                <span><i data-lucide="calendar" style="width: 14px; position: relative; top: 2px;"></i>
                    {{.Article.PublishedAt.Format "02 Jan 2006"}}</span>
                <span><i data-lucide="clock" style="width: 14px; position: relative; top: 2px;"></i> อ่าน 5 นาที</span>
            </div>
        </header>

        {{if .Article.ImageURL}}
        <img src="{{.Article.ImageURL}}" alt="{{.Article.Title}}" class="article-hero-image">
        {{end}}

        <div class="article-content">
            {{.Article.Content | safeHTML}}
        </div>

        <style>
            /* Tailwind compatibility classes commonly found in content */
            .flex {
                display: flex;
            }

            .justify-center {
                justify-content: center;
            }

            .my-6 {
                margin-top: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .mx-auto {
                margin-left: auto;
                margin-right: auto;
            }

            .rounded-lg {
                border-radius: 0.5rem;
            }

            .shadow-lg {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            }

            .article-content img {
                max-width: 100%;
                height: auto;
                border-radius: 8px;
            }
        </style>

        <div
            style="border-top: 1px solid #eee; margin-top: 40px; padding-top: 20px; display: flex; justify-content: space-between;">
            <div class="share-buttons">
                <span style="font-size: 14px; color: #999; margin-right: 15px;">แชร์บทความ:</span>
                <i data-lucide="facebook" style="cursor: pointer; margin-right: 10px;"></i>
                <i data-lucide="twitter" style="cursor: pointer; margin-right: 10px;"></i>
                <i data-lucide="link" style="cursor: pointer;"></i>
            </div>
        </div>
    </article>

    <section class="related-section">
        <div class="container" style="max-width: 1100px; margin: 0 auto; padding: 0 20px;">
            <h2 style="font-family: 'Prompt'; text-align: center; margin-bottom: 40px;">บทความที่คุณอาจสนใจ</h2>
            <div class="related-grid">
                {{range .Highlights}}
                <a href="/article/{{.Slug}}" class="related-card">
                    <div class="card-image-wrapper">
                        <img src="{{if .ImageURL}}{{.ImageURL}}{{else}}/main_highlight.png{{end}}" alt="{{.Title}}">
                    </div>
                    <div class="related-card-content">
                        <h3 class="related-card-title">{{.Title}}</h3>
                    </div>
                </a>
                {{else}}
                <p style="text-align: center; color: #999;">ไม่พบข้อความแนะนำ</p>
                {{end}}
            </div>
        </div>
    </section>

    <style>
        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .related-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }

        .card-image-wrapper {
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: #eee;
        }

        .related-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .related-card-content {
            padding: 12px;
            flex-grow: 1;
        }

        .related-card-title {
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            color: #333;
        }

        @media (max-width: 900px) {
            .related-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .related-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
