upstream go_naming_backend {
    server 127.0.0.1:8095;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=chuedee_per_ip:10m rate=30r/s;

server {
    listen 80;
    listen 443 ssl;
    server_name xn--b3cu8e7ah6h.com www.xn--b3cu8e7ah6h.com;

    # Snakeoil Certificate (Default on Ubuntu)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    client_max_body_size 10m;
    keepalive_timeout 65s;

    location / {
        limit_req zone=chuedee_per_ip burst=60 nodelay;

        proxy_pass http://go_naming_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 135s;
        send_timeout 30s;

        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }
}
