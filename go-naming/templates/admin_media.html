<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังรูปภาพ - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #E2B237;
            --primary-light: #F2994A;
            --secondary: #9B51E0;
            --accent: #FF2E93;
            --bg: linear-gradient(135deg, #FAF8FF 0%, #FFF5FA 50%, #FFFDF5 100%);
            --card: rgba(255, 255, 255, 0.85);
            --border-color: rgba(155, 81, 224, 0.12);
            --border-color-hover: rgba(155, 81, 224, 0.32);
            --text: #2D1E4E;
            --text-muted: #6C5B7B;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg) no-repeat fixed;
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .navbar {
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text);
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2D1E4E, #9B51E0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(155, 81, 224, 0.05);
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .media-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(155, 81, 224, 0.05);
        }

        .media-item:hover {
            transform: translateY(-5px);
            border-color: var(--border-color-hover);
            box-shadow: 0 10px 15px -3px rgba(155, 81, 224, 0.1);
        }

        .media-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: rgba(155, 81, 224, 0.05);
            cursor: pointer;
        }

        .media-info {
            padding: 10px;
            font-size: 0.8rem;
        }

        .media-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .media-actions {
            display: flex;
            gap: 5px;
        }

        .btn {
            background: linear-gradient(135deg, #9B51E0, #FF2E93);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(155, 81, 224, 0.2);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(155, 81, 224, 0.3);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.75rem;
        }

        .btn-delete {
            background: #EF4444 !important;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2) !important;
        }

        .btn-delete:hover {
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3) !important;
        }

        .btn-copy {
            background: #10B981 !important;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2) !important;
        }

        .btn-copy:hover {
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3) !important;
        }

        .upload-area {
            border: 2px dashed rgba(155, 81, 224, 0.2);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-muted);
        }

        .upload-area:hover {
            border-color: var(--secondary);
            background: rgba(155, 81, 224, 0.02);
            color: var(--secondary);
        }

        .upload-area i {
            font-size: 2.5rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="/admin/dashboard" class="logo">
            <i class="fas fa-shield-halved"></i>
            Admin Center
        </a>
        <div class="nav-right" style="display: flex; gap: 20px; align-items: center;">
            <a href="/admin/articles" style="color: #94A3B8; text-decoration: none; font-size: 0.9rem;">
                <i class="fas fa-newspaper"></i> จัดการบทความ
            </a>
            <a href="/admin/logout" style="color: #EF4444; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-images"></i> คลังรูปภาพ (Library)</h1>
        </div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt"></i>
            <p style="margin: 0; font-weight: 600;">คลิกเพื่ออัปโหลดรูปภาพใหม่</p>
            <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: #94A3B8;">ขนาดยังไม่เกิน 10MB (JPG, PNG, WEBP)</p>
            <input type="file" id="fileInput" accept="image/*" onchange="uploadFile(this)">
        </div>

        <div class="card">
            <div id="mediaGrid" class="media-grid">
                <!-- Loaded via JS -->
                <p style="text-align: center; color: #94A3B8; grid-column: 1/-1;">กำลังโหลดรูปภาพ...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadMedia);

        async function loadMedia() {
            try {
                // Add timestamp to prevent caching
                const res = await fetch('/api/v1/admin/media/list?t=' + Date.now());
                const data = await res.json();
                const grid = document.getElementById('mediaGrid');
                grid.innerHTML = '';

                if (data.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; color: #94A3B8; grid-column: 1/-1;">ยังไม่มีรูปภาพในคลัง</p>';
                    return;
                }

                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'media-item';
                    div.innerHTML = `
                        <img src="${item.url}" class="media-preview" onclick="window.open('${item.url}', '_blank')">
                        <div class="media-info">
                            <div class="media-name" title="${item.name}">${item.name}</div>
                            <div class="media-actions">
                                <button class="btn btn-sm btn-copy" onclick="copyUrl('${item.url}')"><i class="fas fa-link"></i> ลิงก์</button>
                                <button class="btn btn-sm btn-delete" onclick="deleteMedia('${item.name}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(div);
                });
            } catch (e) {
                console.error("Load failed", e);
            }
        }

        async function uploadFile(input) {
            if (!input.files || input.files.length === 0) return;

            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/v1/admin/media/upload', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    loadMedia();
                    input.value = ''; // clear input
                } else {
                    alert('อัปโหลดไม่สำเร็จ');
                }
            } catch (e) {
                alert('เกิดข้อผิดพลาด');
            }
        }

        async function deleteMedia(name) {
            if (!confirm(`คุณต้องการลบรูป ${name} ใช่หรือไม่?`)) return;

            try {
                const res = await fetch('/api/v1/admin/media/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                if (res.ok) {
                    loadMedia();
                } else {
                    alert('ลบไม่สำเร็จ');
                }
            } catch (e) {
                alert('เกิดข้อผิดพลาด');
            }
        }

        function copyUrl(url) {
            // Include domain if possible, but relative is often safer for internal use
            const fullUrl = window.location.origin + url;
            navigator.clipboard.writeText(fullUrl).then(() => {
                alert('คัดลอก URL แล้ว: ' + fullUrl);
            });
        }
    </script>
</body>

</html>
