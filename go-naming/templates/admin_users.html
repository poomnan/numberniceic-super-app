<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสมาชิก - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #E2B237;
            --primary-light: #F2994A;
            --secondary: #9B51E0;
            --accent: #FF2E93;
            --bg: linear-gradient(135deg, #FAF8FF 0%, #FFF5FA 50%, #FFFDF5 100%);
            --card: rgba(255, 255, 255, 0.85);
            --border-color: rgba(155, 81, 224, 0.12);
            --border-color-hover: rgba(155, 81, 224, 0.32);
            --text: #2D1E4E;
            --text-muted: #6C5B7B;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--bg) no-repeat fixed;
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .navbar {
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text);
            margin: 0;
            font-weight: 700;
            background: linear-gradient(135deg, #2D1E4E, #9B51E0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #FFFFFF;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(155, 81, 224, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #9B51E0, #FF2E93);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(155, 81, 224, 0.2);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(155, 81, 224, 0.3);
        }

        .btn-secondary {
            background: var(--text-muted);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(155, 81, 224, 0.05);
        }

        th {
            text-align: left;
            padding: 15px;
            background: rgba(155, 81, 224, 0.08);
            font-size: 14px;
            color: var(--text);
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 15px;
            color: var(--text);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-vip {
            background: rgba(226, 178, 55, 0.15);
            color: #C2931A;
            border: 1px solid rgba(226, 178, 55, 0.3);
        }

        .badge-premium {
            background: rgba(155, 81, 224, 0.15);
            color: #9B51E0;
            border: 1px solid rgba(155, 81, 224, 0.3);
        }

        .badge-normal {
            background: rgba(108, 91, 123, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(108, 91, 123, 0.2);
        }

        select {
            background: #FFFFFF;
            color: var(--text);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--secondary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="/admin/dashboard" class="logo">
            <i class="fas fa-shield-halved"></i>
            Admin Center
        </a>
        <div class="nav-right" style="display: flex; gap: 20px; align-items: center;">
            <a href="/" style="color: #94A3B8; text-decoration: none; font-size: 0.9rem;">
                <i class="fas fa-external-link-alt"></i> กลับสู่หน้าเว็บ
            </a>
            <a href="/admin/logout" style="color: #EF4444; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-users"></i> จัดการสมาชิก</h1>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ค้นหาชื่อผู้ใช้, ชื่อจริง, หรือ Member ID..."
                onkeyup="if(event.key === 'Enter') searchUsers()">
            <button class="btn" onclick="searchUsers()"><i class="fas fa-search"></i> ค้นหา</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Member ID</th>
                    <th>Username</th>
                    <th>ชื่อ - นามสกุล</th>
                    <th>สถานะดาว (VIP)</th>
                    <th>การจัดการ</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
        <div id="loading" class="loading" style="display:none;">กำลังโหลด...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => searchUsers());

        async function searchUsers() {
            const search = document.getElementById('searchInput').value;
            const tableBody = document.getElementById('userTableBody');
            const loading = document.getElementById('loading');

            tableBody.innerHTML = '';
            loading.style.display = 'block';

            try {
                const res = await fetch(`/admin/users/list?search=${encodeURIComponent(search)}`);
                const data = await res.json();

                loading.style.display = 'none';

                if (data.status === 'success' && data.users) {
                    data.users.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.style.transition = 'background-color 0.2s';
                        tr.addEventListener('mouseenter', () => tr.style.backgroundColor = 'rgba(155, 81, 224, 0.02)');
                        tr.addEventListener('mouseleave', () => tr.style.backgroundColor = 'transparent');
                        
                        let badgeClass = 'badge-normal';
                        if (user.vipcode === 'vip') {
                            badgeClass = 'badge-vip';
                        } else if (user.vipcode === 'premium') {
                            badgeClass = 'badge-premium';
                        }

                        tr.innerHTML = `
                            <td><code>${user.memberid}</code></td>
                            <td style="font-weight: 500;">${user.username}</td>
                            <td>${user.realname} ${user.surname}</td>
                            <td>
                                <span class="badge ${badgeClass}">
                                    ${user.vipcode || 'normal'}
                                </span>
                            </td>
                            <td>
                                <select onchange="updateStatus('${user.memberid}', this.value)">
                                    <option value="normal" ${user.vipcode === 'normal' ? 'selected' : ''}>Normal</option>
                                    <option value="vip" ${user.vipcode === 'vip' ? 'selected' : ''}>VIP</option>
                                    <option value="premium" ${user.vipcode === 'premium' ? 'selected' : ''}>Premium</option>
                                </select>
                            </td>
                        `;
                        tableBody.appendChild(tr);
                    });
                }
            } catch (err) {
                loading.innerText = 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
            }
        }

        async function updateStatus(memberId, newStatus) {
            try {
                const res = await fetch('/admin/member/update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memberid: memberId,
                        vipcode: newStatus
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    alert('อัพเดทสถานะสำเร็จ');
                    searchUsers();
                } else {
                    alert('เกิดข้อผิดพลาด: ' + data.message);
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        }
    </script>
</body>

</html>
