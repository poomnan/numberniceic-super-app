<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บทความทั้งหมด - Go Naming</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-pink: #D4AF37;
            --dark-bg: #FFF8E1;
            --dark-surface: #FFFAF0;
            --dark-surface-2: #FFF3C4;
            --text-main: #2C1810;
            --text-title: #1A0D07;
            --text-muted: #5D4037;
            --accent-glow: rgba(212, 175, 55, 0.2);
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease;
        }

        .articles-nav {
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .page-header {
            background: var(--dark-surface);
            padding: 80px 0;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .page-header h1 {
            font-family: 'Prompt', sans-serif;
            font-size: 38px;
            font-weight: 700;
            margin: 0;
            color: var(--text-title);
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: var(--text-muted);
            margin-top: 15px;
            font-size: 18px;
            font-weight: 300;
        }

        .articles-grid {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 35px;
        }

        .article-card {
            background: var(--dark-surface-2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid #444;
        }

        .article-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-pink);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
        }

        .card-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: #222;
            transition: transform 0.5s ease;
        }

        .article-card:hover .card-image {
            transform: scale(1.05);
        }

        .card-body {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-category {
            color: var(--primary-pink);
            font-family: 'Prompt', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .card-title {
            font-family: 'Prompt', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-title);
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .card-excerpt {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 300;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .pagination {
            max-width: 1200px;
            margin: 60px auto 100px auto;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .pagination-btn {
            padding: 12px 24px;
            border-radius: 8px;
            background: var(--dark-surface-2);
            border: 1px solid #444;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            transition: all 0.2s;
        }

        .pagination-btn:hover {
            border-color: var(--primary-pink);
            color: var(--primary-pink);
            background: var(--dark-surface);
        }

        .pagination-btn.active {
            background: var(--primary-pink);
            border-color: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        @media (max-width: 768px) {
            .articles-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <nav class="articles-nav">
        <div class="container"
            style="display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 0 20px;">
            <a href="/" style="text-decoration: none; display: flex; align-items: center;">
                <span
                    style="font-family: 'Prompt'; font-weight: 800; font-size: 20px; background: linear-gradient(135deg, #B8860B, #D4AF37); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">แอปชื่อดี</span>
            </a>
            <a href="/"
                style="text-decoration: none; color: #666; font-family: 'Prompt'; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 5px;">
                <i data-lucide="home" style="width: 16px;"></i> หน้าแรก
            </a>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>คลังความรู้เรื่องชื่อมงคล</h1>
            <p>รวมบทความ เทคนิค และศาสตร์การตั้งชื่อที่คุณควรรู้</p>
        </div>
    </header>

    <main class="articles-grid">
        {{range .Articles}}
        <a href="/article/{{.Slug}}" class="article-card">
            <img src="{{if .ImageURL}}{{.ImageURL}}{{else}}/main_highlight.png{{end}}" alt="{{.Title}}"
                class="card-image">
            <div class="card-body">
                <span class="card-category">{{.Category}}</span>
                <h2 class="card-title">{{.Title}}</h2>
                <p class="card-excerpt">{{.Excerpt}}</p>
                <div class="card-footer">
                    <span><i data-lucide="calendar" style="width: 12px; margin-right: 5px;"></i> {{.PublishedAt.Format
                        "02 Jan 2006"}}</span>
                    <span>อ่านต่อ <i data-lucide="arrow-right" style="width: 12px;"></i></span>
                </div>
            </div>
        </a>
        {{else}}
        <div style="grid-column: 1/-1; text-align: center; padding: 100px 0;">
            <p style="color: #999; font-size: 18px;">ยังไม่มีบทความในขณะนี้</p>
        </div>
        {{end}}
    </main>

    <div class="pagination">
        {{if gt .Page 1}}
        <a href="/articles?page={{add .Page -1}}" class="pagination-btn">ก่อนหน้า</a>
        {{end}}
        <a href="/articles?page={{.Page}}" class="pagination-btn active">{{.Page}}</a>
        <a href="/articles?page={{add .Page 1}}" class="pagination-btn">ถัดไป</a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
