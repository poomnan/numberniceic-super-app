<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการชื่อ - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #E2B237;
            --primary-light: #F2994A;
            --secondary: #9B51E0;
            --accent: #FF2E93;
            --bg: linear-gradient(135deg, #FAF8FF 0%, #FFF5FA 50%, #FFFDF5 100%);
            --card: rgba(255, 255, 255, 0.85);
            --border-color: rgba(155, 81, 224, 0.12);
            --border-color-hover: rgba(155, 81, 224, 0.32);
            --text: #2D1E4E;
            --text-muted: #6C5B7B;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg) no-repeat fixed;
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .navbar {
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text);
            margin: 0;
            font-weight: 700;
            background: linear-gradient(135deg, #2D1E4E, #9B51E0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(155, 81, 224, 0.05);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-full {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #FFFFFF;
            color: var(--text);
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(155, 81, 224, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(135deg, #9B51E0, #FF2E93);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(155, 81, 224, 0.2);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(155, 81, 224, 0.3);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.75;
            transform: none;
        }

        .btn-delete {
            background: #EF4444 !important;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2) !important;
        }

        .btn-delete:hover {
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3) !important;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
        }

        .status-draft {
            background: rgba(245, 158, 11, 0.1);
            color: #F59E0B;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }

        .toolbar .search-box {
            max-width: 420px;
            position: relative;
            width: 100%;
        }

        .toolbar .search-box i {
            color: var(--text-muted);
            left: 12px;
            pointer-events: none;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .toolbar .search-box input {
            padding-left: 40px;
        }

        .name-title {
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .meaning-cell {
            color: var(--text-muted);
            max-width: 360px;
            line-height: 1.45;
        }

        .label-row {
            align-items: center;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .btn-small {
            padding: 8px 14px;
            font-size: 0.85rem;
            box-shadow: 0 3px 5px -1px rgba(155, 81, 224, 0.16);
        }

        .pair-pill {
            background: rgba(155, 81, 224, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            color: var(--secondary);
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            margin: 2px 3px 2px 0;
            padding: 2px 8px;
            white-space: nowrap;
        }

        .analysis-preview {
            display: none;
            grid-column: span 2;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .analysis-box {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .analysis-title {
            align-items: center;
            color: var(--text);
            display: flex;
            font-weight: 700;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .analysis-sum {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .analysis-pair {
            align-items: center;
            border-radius: 8px;
            display: inline-flex;
            font-size: 0.9rem;
            font-weight: 700;
            gap: 6px;
            margin: 4px 6px 4px 0;
            padding: 7px 10px;
        }

        .analysis-good {
            background: rgba(16, 185, 129, 0.12);
            color: #047857;
        }

        .analysis-bad {
            background: rgba(239, 68, 68, 0.12);
            color: #B91C1C;
        }

        .empty-state {
            color: var(--text-muted);
            padding: 28px 16px;
            text-align: center;
        }

        .toast {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--secondary);
            border-radius: 8px;
            bottom: 24px;
            box-shadow: 0 10px 20px rgba(45, 30, 78, 0.12);
            color: var(--text);
            display: none;
            font-weight: 600;
            max-width: 420px;
            padding: 14px 18px;
            position: fixed;
            right: 24px;
            z-index: 200;
        }

        .toast.error {
            border-left-color: #EF4444;
        }

        .toast.success {
            border-left-color: #10B981;
        }

        @media (max-width: 768px) {
            .navbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
                gap: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-full {
                grid-column: span 1;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .analysis-preview {
                grid-column: span 1;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="/admin/dashboard" class="logo">
            <i class="fas fa-shield-halved"></i>
            Admin Center
        </a>
        <div class="nav-right" style="display: flex; gap: 20px; align-items: center;">
            <a href="/" style="color: #94A3B8; text-decoration: none; font-size: 0.9rem;">
                <i class="fas fa-external-link-alt"></i> กลับสู่หน้าเว็บ
            </a>
            <a href="/admin/logout" style="color: #EF4444; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-signature"></i> จัดการคลังชื่อ</h1>
            <button class="btn" onclick="showNewForm()"><i class="fas fa-plus"></i> เพิ่มชื่อใหม่</button>
        </div>

        <div id="tableSection">
            <div class="toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="search" id="searchInput" placeholder="ค้นหาชื่อหรือความหมาย">
                </div>
            </div>

            <h3><i class="fas fa-list"></i> รายการชื่อทั้งหมด</h3>
            <div class="card" style="padding: 0; overflow: hidden; margin-bottom: 40px;">
                <div class="table-wrap">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; min-width: 980px;">
                        <thead
                            style="background: rgba(155, 81, 224, 0.08); color: var(--text); font-size: 0.95rem; font-weight: 600;">
                            <tr>
                                <th style="padding: 12px 16px;">ชื่อ</th>
                                <th style="padding: 12px 16px;">เพศ</th>
                                <th style="padding: 12px 16px;">เลขศาสตร์</th>
                                <th style="padding: 12px 16px;">พลังเงา</th>
                                <th style="padding: 12px 16px;">คู่เลข</th>
                                <th style="padding: 12px 16px;">เสียง</th>
                                <th style="padding: 12px 16px;">ความหมาย</th>
                                <th style="padding: 12px 16px;">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="namesTableBody">
                            <tr>
                                <td colspan="8" class="empty-state">กำลังโหลดข้อมูล...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="nameFormSection" class="card" style="display: none; border: 2px solid var(--primary);">
            <h3 id="formTitle">เพิ่มชื่อใหม่</h3>
            <form id="nameForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>ชื่อภาษาไทย</label>
                        <input type="text" id="thName" placeholder="เช่น กานต์พิชชา" required>
                    </div>
                    <div class="form-group">
                        <label>เพศ</label>
                        <select id="gender">
                            <option value="ค">คละเพศ</option>
                            <option value="ช">ชาย</option>
                            <option value="ญ">หญิง</option>
                        </select>
                    </div>
                    <div id="analysisPreview" class="analysis-preview">
                        <div class="analysis-box">
                            <div class="analysis-title">
                                <span>เลขศาสตร์</span>
                                <span class="analysis-sum" id="satSumPreview">ผลรวม 0</span>
                            </div>
                            <div id="satPairsPreview"></div>
                        </div>
                        <div class="analysis-box">
                            <div class="analysis-title">
                                <span>พลังเงา</span>
                                <span class="analysis-sum" id="shaSumPreview">ผลรวม 0</span>
                            </div>
                            <div id="shaPairsPreview"></div>
                        </div>
                    </div>
                    <div class="form-group form-full">
                        <div class="label-row">
                            <label>ความหมาย</label>
                            <button class="btn btn-small" id="btnGenerateMeaning" type="button" onclick="generateMeaning()">
                                <i class="fas fa-wand-magic-sparkles"></i> ช่วยคิดความหมาย
                            </button>
                        </div>
                        <textarea id="meaning" placeholder="ระบุความหมายของชื่อ"></textarea>
                    </div>
                </div>

                <div style="margin-top:20px; display: flex; gap: 10px;">
                    <button class="btn" id="btnSaveName" type="submit">
                        <i class="fas fa-save"></i> บันทึกชื่อ
                    </button>
                    <button class="btn btn-delete" type="button" onclick="hideForm()">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let searchTimer = null;
        let analyzeTimer = null;
        let namesByID = {};

        document.addEventListener('DOMContentLoaded', () => {
            loadNames();

            document.getElementById('searchInput').addEventListener('input', (event) => {
                clearTimeout(searchTimer);
                const query = event.target.value.trim();
                searchTimer = setTimeout(() => {
                    if (query) {
                        searchNames(query);
                    } else {
                        loadNames();
                    }
                }, 300);
            });

            document.getElementById('nameForm').addEventListener('submit', submitName);
            document.getElementById('thName').addEventListener('input', () => {
                clearTimeout(analyzeTimer);
                analyzeTimer = setTimeout(analyzeNamePreview, 250);
            });
        });

        async function loadNames() {
            await fetchAndRender('/api/v1/admin/names/list');
        }

        async function searchNames(query) {
            await fetchAndRender('/api/v1/admin/names/search?q=' + encodeURIComponent(query));
        }

        async function fetchAndRender(url) {
            const tbody = document.getElementById('namesTableBody');
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">กำลังโหลดข้อมูล...</td></tr>';

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(await readError(res));
                const data = await res.json();
                renderTable(Array.isArray(data) ? data : []);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state">${escapeHtml(err.message || 'โหลดข้อมูลไม่สำเร็จ')}</td></tr>`;
                showToast(err.message || 'โหลดข้อมูลไม่สำเร็จ', 'error');
            }
        }

        function renderTable(items) {
            const tbody = document.getElementById('namesTableBody');
            tbody.innerHTML = '';
            namesByID = {};

            if (!items.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">ไม่พบข้อมูล</td></tr>';
                return;
            }

            items.forEach(item => {
                namesByID[item.name_id] = item.th_name || '';
                const tr = document.createElement('tr');
                tr.style.borderTop = '1px solid var(--border-color)';
                tr.style.transition = 'background-color 0.2s';
                tr.addEventListener('mouseenter', () => tr.style.backgroundColor = 'rgba(155, 81, 224, 0.02)');
                tr.addEventListener('mouseleave', () => tr.style.backgroundColor = 'transparent');
                tr.innerHTML = `
                    <td style="padding: 12px 16px;">
                        <div class="name-title">${escapeHtml(item.th_name || '')}</div>
                        <small style="color: var(--text-muted); font-size: 0.8rem;">ID ${item.name_id}</small>
                    </td>
                    <td style="padding: 12px 16px;">${genderLabel(item.gender)}</td>
                    <td style="padding: 12px 16px; color: var(--text); font-weight: 600;">${item.sat_sum || 0}</td>
                    <td style="padding: 12px 16px; color: var(--text); font-weight: 600;">${item.sha_sum || 0}</td>
                    <td style="padding: 12px 16px;">
                        ${renderPairPills(item.t_sat, 'ศ')}
                        ${renderPairPills(item.t_sha, 'ง')}
                    </td>
                    <td style="padding: 12px 16px;">
                        ${renderPhonetic(item)}
                    </td>
                    <td style="padding: 12px 16px;">
                        <div class="meaning-cell">${escapeHtml(shortText(item.meaning || '', 120))}</div>
                    </td>
                    <td style="padding: 12px 16px;">
                        <button class="btn btn-delete" style="padding: 6px 10px; font-size: 0.8rem; box-shadow: none;" onclick="deleteName(${item.name_id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showNewForm() {
            document.getElementById('nameForm').reset();
            document.getElementById('gender').value = 'ค';
            clearAnalysisPreview();
            document.getElementById('tableSection').style.display = 'none';
            document.getElementById('nameFormSection').style.display = 'block';
            document.getElementById('thName').focus();
        }

        function hideForm() {
            document.getElementById('nameFormSection').style.display = 'none';
            document.getElementById('tableSection').style.display = 'block';
        }

        async function analyzeNamePreview() {
            const thName = document.getElementById('thName').value.trim();
            if (!thName) {
                clearAnalysisPreview();
                return;
            }

            try {
                const res = await fetch('/api/v1/admin/names/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ th_name: thName })
                });

                if (!res.ok) throw new Error(await readError(res));
                const data = await res.json();
                renderAnalysisPreview(data);
            } catch (err) {
                clearAnalysisPreview();
                showToast(err.message || 'วิเคราะห์คู่เลขไม่สำเร็จ', 'error');
            }
        }

        function renderAnalysisPreview(data) {
            document.getElementById('analysisPreview').style.display = 'grid';
            document.getElementById('satSumPreview').textContent = `ผลรวม ${data.sat_sum || 0}`;
            document.getElementById('shaSumPreview').textContent = `ผลรวม ${data.sha_sum || 0}`;
            document.getElementById('satPairsPreview').innerHTML = renderAnalysisPairs(data.sat);
            document.getElementById('shaPairsPreview').innerHTML = renderAnalysisPairs(data.sha);
        }

        function renderAnalysisPairs(pairs) {
            if (!Array.isArray(pairs) || !pairs.length) {
                return '<span style="color: var(--text-muted);">ไม่มีข้อมูลคู่เลข</span>';
            }

            return pairs.map(pair => {
                const isGood = !!pair.is_good;
                const className = isGood ? 'analysis-good' : 'analysis-bad';
                const status = isGood ? 'ดี' : 'ร้าย';
                const pairType = pair.pair_type || 'Unknown';
                return `<span class="analysis-pair ${className}">${escapeHtml(pair.pair || '-')} ${escapeHtml(pairType)} ${status}</span>`;
            }).join('');
        }

        function clearAnalysisPreview() {
            document.getElementById('analysisPreview').style.display = 'none';
            document.getElementById('satPairsPreview').innerHTML = '';
            document.getElementById('shaPairsPreview').innerHTML = '';
            document.getElementById('satSumPreview').textContent = 'ผลรวม 0';
            document.getElementById('shaSumPreview').textContent = 'ผลรวม 0';
        }

        async function generateMeaning() {
            const btn = document.getElementById('btnGenerateMeaning');
            const originalHTML = btn.innerHTML;
            const thName = document.getElementById('thName').value.trim();

            if (!thName) {
                showToast('กรุณาระบุชื่อก่อน', 'error');
                document.getElementById('thName').focus();
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังคิด...';

            try {
                const res = await fetch('/api/v1/admin/names/generate-meaning', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ th_name: thName })
                });

                if (!res.ok) throw new Error(await readError(res));
                const data = await res.json();
                document.getElementById('meaning').value = data.meaning || '';
                showToast('สร้างความหมายสำเร็จ', 'success');
            } catch (err) {
                showToast(err.message || 'สร้างความหมายไม่สำเร็จ', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        async function submitName(event) {
            event.preventDefault();

            const btn = document.getElementById('btnSaveName');
            const originalHTML = btn.innerHTML;
            const payload = {
                th_name: document.getElementById('thName').value.trim(),
                gender: document.getElementById('gender').value,
                meaning: document.getElementById('meaning').value.trim()
            };

            if (!payload.th_name) {
                showToast('กรุณาระบุชื่อ', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = payload.meaning
                ? '<i class="fas fa-spinner fa-spin"></i> กำลังบันทึก...'
                : '<i class="fas fa-spinner fa-spin"></i> กำลังคิดและบันทึก...';

            try {
                const res = await fetch('/api/v1/admin/names/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error(await readError(res));

                showToast('เพิ่มชื่อใหม่สำเร็จ', 'success');
                hideForm();
                document.getElementById('searchInput').value = '';
                await loadNames();
            } catch (err) {
                showToast(err.message || 'บันทึกไม่สำเร็จ', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        async function deleteName(id) {
            const name = namesByID[id] || `ID ${id}`;
            if (!confirm(`คุณต้องการลบ "${name}" ใช่หรือไม่?`)) return;

            try {
                const res = await fetch('/api/v1/admin/names/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                if (!res.ok) throw new Error(await readError(res));

                showToast('ลบชื่อสำเร็จ', 'success');
                const query = document.getElementById('searchInput').value.trim();
                if (query) {
                    await searchNames(query);
                } else {
                    await loadNames();
                }
            } catch (err) {
                showToast(err.message || 'ลบไม่สำเร็จ', 'error');
            }
        }

        function renderPairPills(values, prefix) {
            if (!Array.isArray(values) || !values.length) return '';
            return values.map(value => `<span class="pair-pill">${prefix}: ${escapeHtml(value || '-')}</span>`).join('');
        }

        function renderPhonetic(item) {
            if (typeof item.phonetic_score === 'number') {
                return `<span class="status-badge status-active">${item.phonetic_score}</span>`;
            }
            return item.phonetic_processed
                ? '<span class="status-badge status-active">พร้อม</span>'
                : '<span class="status-badge status-draft">รอ</span>';
        }

        function genderLabel(value) {
            if (value === 'ช') return 'ชาย';
            if (value === 'ญ') return 'หญิง';
            return 'คละเพศ';
        }

        async function readError(res) {
            const contentType = res.headers.get('content-type') || '';
            if (contentType.includes('application/json')) {
                const data = await res.json();
                return data.error || data.message || 'เกิดข้อผิดพลาด';
            }
            const text = await res.text();
            return text || 'เกิดข้อผิดพลาด';
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (type || 'success');
            toast.style.display = 'block';
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => {
                toast.style.display = 'none';
            }, 3200);
        }

        function shortText(value, maxLength) {
            if (!value || value.length <= maxLength) return value || '';
            return value.slice(0, maxLength - 1) + '…';
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

    </script>
</body>

</html>
